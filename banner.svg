<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="300" fill="#0D1117"/>
  
  <!-- Geometric Shapes Group 1: Left side -->
  <!-- Purple Circle outline -->
  <circle cx="150" cy="220" r="25" stroke="#C084FC" stroke-width="8"/>
  <!-- Blue Hexagon -->
  <path d="M 80 80 L 100 65 L 120 80 L 120 110 L 100 125 L 80 110 Z" fill="#60A5FA"/>
  <!-- Yellow Plus -->
  <path d="M 250 140 h 12 v -12 h 12 v 12 h 12 v 12 h -12 v 12 h -12 v -12 h -12 z" fill="#FBBF24"/>
  <!-- Green Square -->
  <rect x="350" y="60" width="30" height="30" stroke="#34D399" stroke-width="6" transform="rotate(20 350 60)"/>
  <!-- Red Circle filled -->
  <circle cx="280" cy="260" r="12" fill="#F87171"/>
  
  <!-- Geometric Shapes Group 2: Right side -->
  <!-- Green Circle filled -->
  <circle cx="1100" cy="90" r="15" fill="#34D399"/>
  <!-- Yellow Square outline -->
  <rect x="950" y="200" width="35" height="35" stroke="#FBBF24" stroke-width="8" transform="rotate(45 950 200)"/>
  <!-- Purple Hexagon outline -->
  <path d="M 1050 140 L 1070 125 L 1090 140 L 1090 170 L 1070 185 L 1050 170 Z" stroke="#C084FC" stroke-width="6"/>
  <!-- Red Plus -->
  <path d="M 850 80 h 10 v -10 h 10 v 10 h 10 v 10 h -10 v 10 h -10 v -10 h -10 z" fill="#F87171"/>
  <!-- Blue Circle outline -->
  <circle cx="900" cy="250" r="18" stroke="#60A5FA" stroke-width="6"/>
  <!-- Purple circle filled -->
  <circle cx="1150" cy="220" r="28" fill="#C084FC"/>

  <!-- Geometric Shapes Group 3: Middle scattered -->
  <!-- Small Blue Circle -->
  <circle cx="750" cy="60" r="8" fill="#60A5FA"/>
  <!-- Small Yellow Plus -->
  <path d="M 450 240 h 8 v -8 h 8 v 8 h 8 v 8 h -8 v 8 h -8 v -8 h -8 z" fill="#FBBF24"/>
  <!-- Small Red Square -->
  <rect x="500" y="40" width="15" height="15" fill="#F87171" transform="rotate(15 500 40)"/>
  <!-- Small Green Circle -->
  <circle cx="700" cy="260" r="10" stroke="#34D399" stroke-width="4"/>

  <!-- Text -->
  <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">HI, I'M</text>
  <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MUKSANA AKTER</text>
</svg>
